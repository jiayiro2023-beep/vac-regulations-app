<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b4a" />
    <meta name="description" content="國軍退除役官兵輔導法規承辦人智慧查詢與津貼試算系統。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const savedTheme = localStorage.getItem('vac_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (error) {
        // Theme hydration is progressive; React applies the final state after mount.
      }
    </script>
    <title>國軍退除役官兵輔導法規｜承辦人智慧查詢與試算系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 font-sans antialiased selection:bg-blue-600 selection:text-white dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
